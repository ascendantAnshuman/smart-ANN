[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartann"
version = "0.1.0"
description = "SMART-ANN: runtime resource-aware adaptive control for on-device RAG retrieval"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ashutosh Gupta", email = "ashutoshgupta5400@gmail.com" }]

# Phase 0 core only. Heavier deps (hnswlib, sentence-transformers, llama-cpp-python)
# are added at the phase that first needs them -- see Section 3 rule 6.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "psutil>=5.9",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    # Phase 1: datasets, embeddings, ground truth
    "h5py>=3.10",
    "requests>=2.31",
    "pysbd>=0.3.4",
    "sentence-transformers>=3.0",
    # Phase 2: the ANN index.
    #
    # This is hnswlib, distributed under a different name. Upstream `hnswlib`
    # publishes NO binary wheels for any Python version (sdist only), so it
    # cannot be installed without a C++ toolchain -- and MSVC installation on
    # this machine requires elevation that is not available. `chroma-hnswlib`
    # is Chroma's redistribution of the same library: it imports as `hnswlib`
    # and its full API surface is verified in tests/test_hnswlib_contract.py.
    #
    # Pinned to 0.7.5 because it is the newest release with a cp312 Windows
    # wheel; 0.7.6 is source-only there. This is also why the project targets
    # Python 3.12 rather than 3.13. See docs/decisions.md ADR-0017.
    "chroma-hnswlib==0.7.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.98",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "pandas-stubs",
    "types-PyYAML",
    "types-psutil",
    "types-tqdm",
    "types-requests",
]

[project.scripts]
smartann = "smartann.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["smartann"]

# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"  # keep our own syntax portable to the floor
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF012",  # mutable class attrs: noisy with dataclass defaults
]

[tool.ruff.lint.flake8-bugbear]
# typer's declarative API puts Argument()/Option() in defaults by design
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"scripts/*" = ["ARG"]

# ----------------------------------------------------------------------------
# mypy: strict on smartann/, lenient on scripts/ and tests/ (Section 4)
[tool.mypy]
# 3.12 rather than the 3.11 floor in requires-python: numpy's bundled stubs use
# PEP 695 `type` statements, which mypy rejects when told to target 3.11. Ruff's
# target-version stays py311 so our own syntax remains portable to the floor.
python_version = "3.12"
files = ["smartann", "scripts", "tests"]
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "smartann.*"
strict = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["scripts.*", "tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "yaml",
    "psutil",
    "matplotlib.*",
    "sklearn.*",
    "scipy.*",
    "h5py",
    "hnswlib",
    "pysbd",
    "sentence_transformers.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running (datasets, index builds, full experiments)",
    "needs_hardware: requires real telemetry sources (RAPL / thermal / battery)",
]
